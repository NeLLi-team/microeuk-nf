<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">microeuk-nf workflow</title>
  <desc id="workflow-desc">The microeuk-nf workflow from ONT or PacBio HiFi DNA reads through quality control, Myloasm assembly, independent bin and contig evidence, evidence-guided candidate routing, domain-specific gene calling, functional annotation, validated SQLite catalog publication, and executed notebook and HTML reports. RNA and lineage-labeled proteins support eukaryotic gene calling but do not enter DNA assembly. Records and artifacts from every stage are retained. Candidate routes guide downstream analysis and do not establish final taxonomy or accepted MAG status.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5966"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28765d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1580" fill="#ffffff"/>

  <g font-family="DejaVu Sans, sans-serif" fill="#17212b">
    <text x="50" y="54" font-size="31" font-weight="700">microeuk-nf workflow</text>
    <text x="50" y="84" font-size="17" fill="#4b5966">Long-read metagenomes to evidence-linked genes, catalog, and reports</text>

    <rect x="40" y="110" width="1120" height="310" rx="18" fill="#f7f9fb" stroke="#c8d2dc" stroke-width="2"/>
    <rect x="40" y="110" width="250" height="38" rx="18" fill="#14324a"/>
    <text x="60" y="136" font-size="18" font-weight="700" fill="#ffffff">1 · Reads and assembly</text>

    <rect x="40" y="440" width="1120" height="445" rx="18" fill="#f7fbf9" stroke="#b9d5ca" stroke-width="2"/>
    <rect x="40" y="440" width="365" height="38" rx="18" fill="#1f6651"/>
    <text x="60" y="466" font-size="18" font-weight="700" fill="#ffffff">2 · Independent evidence and routing</text>

    <rect x="40" y="905" width="1120" height="410" rx="18" fill="#fbf8f4" stroke="#ddc9ad" stroke-width="2"/>
    <rect x="40" y="905" width="275" height="38" rx="18" fill="#7a4c17"/>
    <text x="60" y="931" font-size="18" font-weight="700" fill="#ffffff">3 · Candidate analysis</text>

    <rect x="40" y="1335" width="1120" height="225" rx="18" fill="#f7f8fb" stroke="#c8cede" stroke-width="2"/>
    <rect x="40" y="1335" width="265" height="38" rx="18" fill="#3f4d78"/>
    <text x="60" y="1361" font-size="18" font-weight="700" fill="#ffffff">4 · Catalog and reports</text>
  </g>

  <!-- Primary workflow connectors -->
  <g fill="none" stroke="#4b5966" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 350 190 H 445"/>
    <path d="M 755 190 H 840"/>
    <path d="M 980 229 V 260 H 210 V 284"/>
    <path d="M 350 332 H 445"/>
    <path d="M 755 332 H 840"/>

    <path d="M 600 374 V 425 H 420 V 484 H 185 V 489"/>
    <path d="M 965 374 V 425 H 895 V 625 H 830 V 649"/>
    <path d="M 1130 215 H 1145 V 455 H 468 V 489"/>
    <path d="M 745 455 V 489"/>
    <path d="M 185 591 V 620 H 370 V 649"/>
    <path d="M 468 591 V 649"/>
    <path d="M 745 591 V 649"/>

    <path d="M 600 756 V 775 H 170 V 794"/>
    <path d="M 600 756 V 775 H 460 V 794"/>
    <path d="M 600 756 V 775 H 750 V 794"/>
    <path d="M 600 756 V 775 H 1035 V 794"/>

    <path d="M 170 852 V 890 H 330 V 958 H 180 V 969"/>
    <path d="M 170 852 V 890 H 330 V 1068 H 320 V 1089"/>
    <path d="M 750 852 V 910 H 430 V 1089"/>
    <path d="M 460 852 V 934 H 625 V 950"/>
    <path d="M 1035 852 V 930 H 1138 V 1125 H 1020 V 1134"/>
    <path d="M 625 1036 V 1124"/>

    <path d="M 320 1181 V 1215 H 445 V 1234"/>
    <path d="M 625 1216 V 1225 H 535 V 1234"/>
    <path d="M 585 1269 H 640"/>
    <path d="M 810 1304 V 1374"/>

    <path d="M 288 1447 V 1461"/>
    <path d="M 515 1501 H 545"/>
    <path d="M 800 1501 H 830"/>
  </g>
  <path d="M 895 446 V 464" fill="none" stroke="#f7fbf9" stroke-width="9" stroke-linecap="round"/>
  <path d="M 895 446 V 464" fill="none" stroke="#4b5966" stroke-width="3" stroke-linecap="round"/>
  <circle cx="745" cy="455" r="4" fill="#4b5966"/>

  <!-- Supporting-evidence connectors -->
  <g fill="none" stroke="#28765d" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)">
    <path d="M 785 1000 H 770 V 1153 H 766"/>
    <path d="M 785 1085 H 780 V 1185 H 766"/>
  </g>

  <!-- Every-stage collection spine -->
  <g fill="none" stroke="#6d7894" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1135 190 H 1173"/>
    <path d="M 950 704 H 1173"/>
    <path d="M 1145 1175 H 1173"/>
    <path d="M 970 1269 H 1173"/>
    <path d="M 1173 190 V 1414 H 1141" marker-end="url(#arrow)"/>
  </g>
  <text x="1187" y="940" transform="rotate(-90 1187 940)" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#596482">records + artifacts from every stage</text>

  <!-- Reads and assembly nodes -->
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <g id="dna-input">
      <rect x="70" y="151" width="280" height="78" rx="12" fill="#e7f0f7" stroke="#2d5f7e" stroke-width="2.5"/>
      <text x="210" y="184" font-size="20" font-weight="700" fill="#14324a">DNA reads</text>
      <text x="210" y="209" font-size="16" fill="#334b5e">ONT or PacBio HiFi</text>
    </g>
    <g id="read-qc">
      <rect x="445" y="151" width="310" height="78" rx="12" fill="#e7f0f7" stroke="#2d5f7e" stroke-width="2.5"/>
      <text x="600" y="184" font-size="20" font-weight="700" fill="#14324a">Read quality control</text>
      <text x="600" y="209" font-size="16" fill="#334b5e">Chopper or SeqKit</text>
    </g>
    <g id="assembly">
      <rect x="840" y="151" width="290" height="78" rx="12" fill="#dceaf4" stroke="#245b7a" stroke-width="3"/>
      <text x="985" y="184" font-size="20" font-weight="700" fill="#14324a">DNA assembly</text>
      <text x="985" y="209" font-size="16" fill="#334b5e">Myloasm or supplied assembly</text>
    </g>
    <g id="mapping-depth">
      <rect x="70" y="285" width="280" height="89" rx="12" fill="#ffffff" stroke="#52758e" stroke-width="2.5"/>
      <text x="210" y="318" font-size="19" font-weight="700" fill="#14324a">Read mapping + depth</text>
      <text x="210" y="343" font-size="15" fill="#4b5966">minimap2 · SAMtools</text>
      <text x="210" y="363" font-size="14" fill="#5f6d78">coverage evidence</text>
    </g>
    <g id="quickbin">
      <rect x="445" y="285" width="310" height="89" rx="12" fill="#ffffff" stroke="#52758e" stroke-width="2.5"/>
      <text x="600" y="318" font-size="19" font-weight="700" fill="#14324a">QuickBin</text>
      <text x="600" y="343" font-size="15" fill="#4b5966">coverage + composition</text>
      <text x="600" y="363" font-size="14" fill="#5f6d78">bins + unbinned contigs retained</text>
    </g>
    <g id="quickclade">
      <rect x="840" y="285" width="290" height="89" rx="12" fill="#ffffff" stroke="#52758e" stroke-width="2.5"/>
      <text x="985" y="318" font-size="19" font-weight="700" fill="#14324a">QuickClade evidence</text>
      <text x="985" y="343" font-size="15" fill="#4b5966">local reference only</text>
      <text x="985" y="363" font-size="14" fill="#5f6d78">comparison evidence, not routing</text>
    </g>
  </g>

  <!-- Evidence and routing nodes -->
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <g id="all-bin-screen">
      <rect x="50" y="490" width="270" height="101" rx="12" fill="#e6f3ef" stroke="#28765d" stroke-width="2.5"/>
      <text x="185" y="521" font-size="19" font-weight="700" fill="#174c3c">Every accepted bin</text>
      <text x="185" y="548" font-size="16" fill="#245847">CheckEUK · CheckM2 · GVClass</text>
      <text x="185" y="573" font-size="14" fill="#45675c">independent screens</text>
    </g>
    <g id="ssu-evidence">
      <rect x="350" y="490" width="235" height="101" rx="12" fill="#e6f3ef" stroke="#28765d" stroke-width="2.5"/>
      <text x="468" y="526" font-size="19" font-weight="700" fill="#174c3c">SSUextract</text>
      <text x="468" y="552" font-size="15" fill="#245847">assembly-wide SSU loci</text>
      <text x="468" y="574" font-size="14" fill="#45675c">linked to physical bins</text>
    </g>
    <g id="viral-evidence">
      <rect x="610" y="490" width="270" height="101" rx="12" fill="#e6f3ef" stroke="#28765d" stroke-width="2.5"/>
      <text x="745" y="526" font-size="19" font-weight="700" fill="#174c3c">geNomad → CheckV</text>
      <text x="745" y="552" font-size="15" fill="#245847">assembly-contig evidence</text>
      <text x="745" y="574" font-size="14" fill="#45675c">whole contigs vs. provirus intervals</text>
    </g>
    <g id="evidence-key">
      <rect x="905" y="490" width="225" height="101" rx="12" fill="#ffffff" stroke="#7aa795" stroke-width="2"/>
      <text x="1018" y="518" font-size="17" font-weight="700" fill="#174c3c">Evidence stays distinct</text>
      <text x="1018" y="544" font-size="14" fill="#45675c">methods and units retained</text>
      <text x="1018" y="565" font-size="14" fill="#45675c">missing values stay null</text>
      <text x="1018" y="583" font-size="14" fill="#45675c">conflicts remain visible</text>
    </g>

    <g id="evidence-integration">
      <rect x="250" y="650" width="700" height="106" rx="14" fill="#d7eee6" stroke="#1f6651" stroke-width="3"/>
      <text x="600" y="683" font-size="21" font-weight="700" fill="#174c3c">Evidence integration</text>
      <text x="600" y="710" font-size="16" fill="#245847">QuickClade · CheckEUK · GVClass · linked SSU · whole-contig viral calls</text>
      <text x="600" y="736" font-size="15" fill="#45675c">assign one candidate route; retain absent and conflicting evidence</text>
    </g>

    <g id="route-prokaryotic">
      <rect x="45" y="795" width="250" height="57" rx="11" fill="#eee8f5" stroke="#6a4c93" stroke-width="2.5"/>
      <text x="170" y="819" font-size="18" font-weight="700" fill="#503671">Prokaryotic candidate</text>
      <text x="170" y="840" font-size="13" fill="#5f4a77">analysis route</text>
    </g>
    <g id="route-eukaryotic">
      <rect x="335" y="795" width="250" height="57" rx="11" fill="#f6ecde" stroke="#9c5a16" stroke-width="2.5"/>
      <text x="460" y="819" font-size="18" font-weight="700" fill="#70400f">Eukaryotic candidate</text>
      <text x="460" y="840" font-size="13" fill="#785a37">analysis route</text>
    </g>
    <g id="route-viral">
      <rect x="625" y="795" width="250" height="57" rx="11" fill="#f8e5e8" stroke="#b23a48" stroke-width="2.5"/>
      <text x="750" y="819" font-size="18" font-weight="700" fill="#7d2732">Viral candidate</text>
      <text x="750" y="840" font-size="13" fill="#85505a">analysis route</text>
    </g>
    <g id="route-unresolved">
      <rect x="915" y="795" width="240" height="57" rx="11" fill="#eceeef" stroke="#5f6368" stroke-width="2.5"/>
      <text x="1035" y="819" font-size="18" font-weight="700" fill="#3f4347">Unresolved</text>
      <text x="1035" y="840" font-size="13" fill="#5f6368">absent or conflicting support</text>
    </g>
  </g>

  <!-- Candidate analysis nodes -->
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <g id="prokaryote-characterization">
      <rect x="45" y="970" width="270" height="85" rx="12" fill="#eee8f5" stroke="#6a4c93" stroke-width="2.5"/>
      <text x="180" y="1000" font-size="18" font-weight="700" fill="#503671">Prokaryotic evidence</text>
      <text x="180" y="1026" font-size="15" fill="#5f4a77">CheckM1 · GTDB-Tk · Symclatron</text>
      <text x="180" y="1046" font-size="13" fill="#6d5a80">domain-specific characterization</text>
    </g>

    <g id="repeat-masking">
      <rect x="485" y="951" width="280" height="85" rx="12" fill="#f6ecde" stroke="#9c5a16" stroke-width="2.5"/>
      <text x="625" y="981" font-size="18" font-weight="700" fill="#70400f">Softmasked eukaryotic bins</text>
      <text x="625" y="1007" font-size="15" fill="#785a37">RepeatModeler · RepeatMasker</text>
      <text x="625" y="1027" font-size="13" fill="#806848">or compatible supplied softmask</text>
    </g>

    <g id="rna-support">
      <rect x="785" y="960" width="335" height="80" rx="12" fill="#e6f3ef" stroke="#28765d" stroke-width="2.5"/>
      <text x="953" y="989" font-size="18" font-weight="700" fill="#174c3c">RNA → bin-matched alignments</text>
      <text x="953" y="1014" font-size="14" fill="#45675c">BRAKER3 support only; never DNA assembly</text>
      <text x="953" y="1032" font-size="13" fill="#58796e">compatible sequencing technology required</text>
    </g>

    <g id="protein-support">
      <rect x="785" y="1052" width="335" height="67" rx="12" fill="#e6f3ef" stroke="#28765d" stroke-width="2.5"/>
      <text x="953" y="1079" font-size="18" font-weight="700" fill="#174c3c">Reference proteins</text>
      <text x="953" y="1104" font-size="14" fill="#45675c">explicit compatible lineage label</text>
    </g>

    <g id="prodigal-gv">
      <rect x="180" y="1090" width="280" height="91" rx="12" fill="#f3eaf1" stroke="#77516f" stroke-width="2.5"/>
      <text x="320" y="1121" font-size="20" font-weight="700" fill="#573750">Prodigal-GV</text>
      <text x="320" y="1147" font-size="15" fill="#674e62">prokaryotic + viral bins</text>
      <text x="320" y="1168" font-size="14" fill="#735f6f">plus unbinned geNomad viral contigs</text>
    </g>

    <g id="braker3">
      <rect x="485" y="1125" width="280" height="91" rx="12" fill="#f6ecde" stroke="#9c5a16" stroke-width="2.5"/>
      <text x="625" y="1157" font-size="20" font-weight="700" fill="#70400f">BRAKER3</text>
      <text x="625" y="1183" font-size="15" fill="#785a37">matched RNA and/or proteins</text>
      <text x="625" y="1204" font-size="14" fill="#806848">unsupported evidence stays pending</text>
    </g>

    <g id="unresolved-retained">
      <rect x="900" y="1135" width="240" height="80" rx="12" fill="#eceeef" stroke="#5f6368" stroke-width="2.5"/>
      <text x="1020" y="1166" font-size="18" font-weight="700" fill="#3f4347">Retained unresolved</text>
      <text x="1020" y="1191" font-size="14" fill="#5f6368">contigs, bins, and evidence</text>
    </g>

    <g id="called-proteins">
      <rect x="320" y="1235" width="265" height="69" rx="12" fill="#ffffff" stroke="#5e6872" stroke-width="2.5"/>
      <text x="453" y="1264" font-size="19" font-weight="700" fill="#28323b">Gene proteins</text>
      <text x="453" y="1288" font-size="14" fill="#5f6d78">zero-gene results remain valid</text>
    </g>
    <g id="functional-annotation">
      <rect x="640" y="1235" width="330" height="69" rx="12" fill="#e7f0e8" stroke="#46724d" stroke-width="2.5"/>
      <text x="805" y="1264" font-size="19" font-weight="700" fill="#315337">Functional annotation</text>
      <text x="805" y="1288" font-size="15" fill="#4d6651">eggNOG-mapper · InterProScan</text>
    </g>
  </g>

  <!-- Catalog and reporting nodes -->
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <g id="all-stage-records">
      <rect x="60" y="1375" width="1080" height="72" rx="12" fill="#e8ebf4" stroke="#596482" stroke-width="3"/>
      <text x="600" y="1404" font-size="20" font-weight="700" fill="#354061">All stage records and artifacts</text>
      <text x="600" y="1429" font-size="15" fill="#596482">reads · assemblies · contigs · bins · unresolved routes · QC · taxonomy · viruses · genes · annotations · provenance</text>
    </g>

    <g id="validation">
      <rect x="60" y="1462" width="455" height="78" rx="12" fill="#ffffff" stroke="#596482" stroke-width="2.5"/>
      <text x="288" y="1492" font-size="18" font-weight="700" fill="#354061">LinkML → generated Pydantic models</text>
      <text x="288" y="1518" font-size="15" fill="#596482">value checks + cross-record validation</text>
    </g>
    <g id="sqlite-catalog">
      <rect x="545" y="1462" width="255" height="78" rx="12" fill="#dfe4f2" stroke="#3f4d78" stroke-width="3"/>
      <text x="673" y="1492" font-size="19" font-weight="700" fill="#2f395a">SQLite catalog</text>
      <text x="673" y="1518" font-size="15" fill="#596482">atomic publication</text>
    </g>
    <g id="reports">
      <rect x="830" y="1462" width="310" height="78" rx="12" fill="#dfe4f2" stroke="#3f4d78" stroke-width="3"/>
      <text x="985" y="1492" font-size="19" font-weight="700" fill="#2f395a">Executed notebook</text>
      <text x="985" y="1518" font-size="15" fill="#596482">embedded figures + HTML report</text>
    </g>
  </g>
</svg>
