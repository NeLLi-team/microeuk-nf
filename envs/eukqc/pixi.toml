[workspace]
name = "protist-eukaryote-qc"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[feature.busco.dependencies]
busco = "==6.1.0"

[feature.tidk.dependencies]
tidk = "==0.3.2"

[environments]
busco = { features = ["busco"], no-default-feature = true }
tidk = { features = ["tidk"], no-default-feature = true }
