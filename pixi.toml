[workspace]
channels = ["conda-forge", "bioconda", "https://repo.prefix.dev/astrogenomics"]
name = "protist-meta-nf"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest"
docs = "mkdocs build --strict"

[dependencies]
python = "3.12.*"
pydantic = "==2.13.4"
pyyaml = "==6.0.2"
linkml = "==1.11.1"
nbformat = "==5.10.4"
nbconvert = "==7.16.6"
nbclient = "==0.10.2"
ipykernel = "==6.30.1"
pandas = "==2.3.2"
matplotlib = "==3.10.6"
pytest = "==8.4.2"
ruff = "==0.16.6"
mkdocs = "==1.6.1"
mkdocs-material = "==9.6.20"
mkdocs-jupyter = "==0.25.1"
nextflow = "==25.10.2"
openjdk = "21.*"
bash = "5.*"
coreutils = "9.*"
gawk = "5.*"
grep = "3.*"
sed = "4.*"
findutils = "4.*"
diffutils = "3.*"
procps-ng = "4.*"

[pypi-dependencies]
protist-meta = { path = ".", editable = true }

[feature.core.dependencies]
python = "3.12.*"
chopper = "==0.13.0"
seqkit = "==2.13.0"
pigz = "==2.8"
myloasm = "==0.6.0"
minimap2 = "==2.31"
samtools = "==1.24"

[environments]
core = { features = ["core"], no-default-feature = true }

[activation.env]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
MPLBACKEND = "Agg"
